name: Universal DevSecOps Enterprise Pipeline

on:
  push:
    branches: ["main"]
  pull_request:

  workflow_dispatch:
    inputs:
      repo_url:
        description: "GitHub repository URL (leave empty for local repo)"
        required: false
      repo_branch:
        description: "Git branch"
        required: false
        default: "main"
      app_port:
        description: "Application port (host port)"
        required: false
        default: "5000"

jobs:
  security:
    runs-on: ubuntu-latest

    env:
      APP_PORT: ${{ github.event.inputs.app_port || '5000' }}   # host port
      APP_INTERNAL_PORT: "5000"                                 # container port (from docker-compose)
      IMAGE_NAME: scanned-app

    steps:
      # ====================================
      # Detect Scan Mode
      # ====================================
      - name: Detect scan mode
        run: |
          if [ -z "${{ github.event.inputs.repo_url }}" ]; then
            echo "SCAN_MODE=LOCAL" >> $GITHUB_ENV
            echo "WORKDIR=." >> $GITHUB_ENV
          else
            echo "SCAN_MODE=EXTERNAL" >> $GITHUB_ENV
            echo "WORKDIR=target-app" >> $GITHUB_ENV
          fi

      # ====================================
      # Extract Target Repository Name
      # ====================================
      - name: Extract target repository name
        run: |
          if [ -z "${{ github.event.inputs.repo_url }}" ]; then
            echo "TARGET_REPO=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV
          else
            REPO_URL="${{ github.event.inputs.repo_url }}"
            REPO_NAME=$(basename -s .git "$REPO_URL")
            echo "TARGET_REPO=$REPO_NAME" >> $GITHUB_ENV
          fi

      # ====================================
      # Checkout Pipeline Repository
      # ====================================
      - name: Checkout pipeline repository
        uses: actions/checkout@v4

      # ====================================
      # Clone External Repository (if needed)
      # ====================================
      - name: Clone external repository
        if: env.SCAN_MODE == 'EXTERNAL'
        run: |
          git clone -b ${{ github.event.inputs.repo_branch }} \
            ${{ github.event.inputs.repo_url }} target-app

      # ====================================
      # Build Docker Image (for Trivy)
      # ====================================
      - name: Build Docker Image
        run: |
          cd "$WORKDIR"
          docker build -t "$IMAGE_NAME" .

      # ====================================
      # Trivy Scan
      # ====================================
      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}
          format: json
          output: trivy.json
        continue-on-error: true



      - name: Ensure .env exists
        run: |
          cd "$WORKDIR"
          if [ ! -f .env ]; then
            echo "Creating missing .env..."
            touch .env
          fi


      # ====================================
      # Run Application (use docker-compose provided by the app repo)
      # ====================================
      - name: Run Application (docker compose)
        run: |
          cd "$WORKDIR"
          docker compose up -d --build

      - name: Get docker-compose network
        run: |
          cd "$WORKDIR"
          # Compose default network usually ends with "_default"
          NET=$(docker network ls --format '{{.Name}}' | grep "_default$" | head -n 1)
          echo "ZAP_NET=$NET" >> $GITHUB_ENV
          echo "Using network: $NET"

      - name: Wait for Application (HTTP check from compose network)
        run: |
          for i in {1..40}; do
            code=$(docker run --rm --network "$ZAP_NET" curlimages/curl:8.5.0 \
              -s -o /dev/null -w "%{http_code}" http://vuln-nodejs:${APP_INTERNAL_PORT} || true)
            if echo "$code" | grep -qE "200|302|401|403"; then
              echo "App is up (HTTP $code)"
              exit 0
            fi
            echo "Waiting for app... (got $code)"
            docker logs --tail 50 vuln-nodejs || true
            sleep 3
          done
          echo "App did not become ready in time"
          docker logs vuln-nodejs || true
          exit 1

      # ====================================
      # OWASP ZAP Full Scan
      # ====================================
      - name: OWASP ZAP Full Scan
        run: |
          docker run --rm \
            --user root \
            --network "$ZAP_NET" \
            -v "$(pwd)":/zap/wrk \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-full-scan.py \
            -t http://vuln-nodejs:${APP_INTERNAL_PORT} \
            -r zap.html \
            -x zap.xml || true

      - name: Debug - list generated files
        run: ls -lah

      # ====================================
      # Setup Python
      # ====================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      # ====================================
      # AI Analysis
      # ====================================
      - name: AI Security Analysis
        run: python ai_security_analysis.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      # ====================================
      # Upload to DefectDojo
      # ====================================
      - name: Upload to DefectDojo
        run: python defectdojo_upload.py
        env:
          DEFECTDOJO_URL: ${{ secrets.DEFECTDOJO_URL }}
          DEFECTDOJO_API_KEY: ${{ secrets.DEFECTDOJO_API_KEY }}
          TARGET_REPO: ${{ env.TARGET_REPO }}

      # ====================================
      # Upload Artifacts
      # ====================================
      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            trivy.json
            zap.xml
            zap.html
            ai_security_recommendations.md
