name: Universal DevSecOps Enterprise Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
    inputs:
      repo_url:
        description: "GitHub repository URL (leave empty for local repo)"
        required: false
      repo_branch:
        description: "Git branch"
        required: false
        default: "main"
      app_port:
        description: "Application port"
        required: false
        default: "80"

jobs:
  security:
    runs-on: ubuntu-latest

    env:
      APP_PORT: ${{ github.event.inputs.app_port || '80' }}
      IMAGE_NAME: scanned-app
      BACKEND_URL: https://35.195.231.227.nip.io
    steps:

    # ====================================
    # Detect Scan Mode
    # ====================================
    - name: Detect scan mode
      run: |
        if [ -z "${{ github.event.inputs.repo_url }}" ]; then
          echo "SCAN_MODE=LOCAL" >> $GITHUB_ENV
          echo "WORKDIR=." >> $GITHUB_ENV
        else
          echo "SCAN_MODE=EXTERNAL" >> $GITHUB_ENV
          echo "WORKDIR=target-app" >> $GITHUB_ENV
        fi

    # ====================================
    # Extract Repository Name
    # ====================================
    - name: Extract repository name
      run: |
        if [ -z "${{ github.event.inputs.repo_url }}" ]; then
          echo "TARGET_REPO=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV
        else
          REPO_URL="${{ github.event.inputs.repo_url }}"
          REPO_NAME=$(basename -s .git "$REPO_URL")
          echo "TARGET_REPO=$REPO_NAME" >> $GITHUB_ENV
        fi

    # ====================================
    # Checkout Pipeline Repo
    # ====================================
    - name: Checkout pipeline repository
      uses: actions/checkout@v4

    # ====================================
    # Clone External Repo
    # ====================================
    - name: Clone external repository
      if: env.SCAN_MODE == 'EXTERNAL'
      run: |
        git clone -b ${{ github.event.inputs.repo_branch }} \
        ${{ github.event.inputs.repo_url }} target-app

    # ====================================
    # Build Docker Image
    # ====================================
    - name: Build Docker Image
      run: |
        cd "$WORKDIR"
        docker build -t "$IMAGE_NAME" .

    # ====================================
    # Trivy Scan (Container Scan)
    # ====================================
    - name: Trivy Image Scan
      uses: aquasecurity/trivy-action@v0.35.0
      with:
        image-ref: ${{ env.IMAGE_NAME }}
        format: json
        output: trivy.json
      continue-on-error: true

    - name: Install dependencies for AI fix
      run: pip install requests

    - name: AI Fix Trivy Vulnerabilities
      run: |
        ls -la
        [ -f trivy.json ] && echo "trivy.json exists" || echo "trivy.json missing"
        python trivy_ai_fix.py
        ls -la
        cat fix_summary.json || true
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    - name: Create PR with fixes
      run: |
        if [ -f fix_summary.json ]; then
          python create_pr.py
        else
          echo "fix_summary.json not found, skipping PR creation"
        fi
      env:
        GH_PAT: ${{ secrets.GH_PAT }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        REPO_URL: ${{ github.event.inputs.repo_url }}
        GITHUB_ACTOR: ${{ github.actor }}
        
    # ====================================
    # Run Application
    # ====================================
    - name: Create Docker Network
      run: docker network create zap-net || true

    - name: Run Application
      run: |
        docker run -d \
          --name app-under-test \
          --network zap-net \
          -p ${APP_PORT}:${APP_PORT} \
          $IMAGE_NAME

    - name: Wait for Application
      run: |
        sleep 30
        echo "=== Docker logs ==="
        docker logs app-under-test || true
        echo "=== Port check ==="
        curl -v http://localhost:${APP_PORT} 2>&1 | head -30 || true

    # ====================================
    # OWASP ZAP Scan (DAST)
    # ====================================
    - name: OWASP ZAP Full Scan
      run: |
        docker run --rm \
          --user root \
          --network zap-net \
          -v "$(pwd)":/zap/wrk \
          ghcr.io/zaproxy/zaproxy:stable \
          zap-full-scan.py \
          -t http://app-under-test:${APP_PORT} \
          -x zap.xml \
          -r zap.html || true

    # ====================================
    # Setup Python
    # ====================================
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: pip install requests

    # ====================================
    # Upload to DefectDojo
    # ====================================
    - name: Upload to DefectDojo
      run: python defectdojo_upload.py
      env:
        DEFECTDOJO_URL: ${{ secrets.DEFECTDOJO_URL }}
        DEFECTDOJO_API_KEY: ${{ secrets.DEFECTDOJO_API_KEY }}
        TARGET_REPO: ${{ env.TARGET_REPO }}
        REPO_BRANCH: ${{ github.event.inputs.repo_branch }}

    # ====================================
    # Upload Security Reports
    # ====================================
    - name: Upload Security Reports
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: |
          trivy.json
          zap.xml
          zap.html

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Debug - find reports
      run: |
          echo "PWD=$(pwd)"
          ls -la
          find . -maxdepth 5 -name "zap.html" -print
          find . -maxdepth 5 -name "zap.xml" -print
          find . -maxdepth 5 -name "trivy.json" -print

    - name: Upload reports to GCS
      run: |
        ZAP_HTML=$(find . -maxdepth 5 -name "zap.html" | head -n 1)

        if [ -z "$ZAP_HTML" ]; then
        echo "zap.html not found"
        exit 0
        fi

        BASE_PATH="gs://secdashboard-security-reports/reports/${{ env.TARGET_REPO }}/${{ github.run_id }}"

        echo "Uploading to $BASE_PATH"

        gcloud storage cp "$ZAP_HTML" "$BASE_PATH/zap.html"


    - name: Upload ZAP Report to Backend
      run: |
        ZAP_HTML=$(find . -maxdepth 5 -name "zap.html" | head -n 1)

        if [ -z "$ZAP_HTML" ]; then
          echo "zap.html not found, skipping upload"
        exit 0
        fi

        curl -X POST "${{ env.BACKEND_URL }}/api/products/upload-zap" \
        -F "repo_name=${{ env.TARGET_REPO }}" \
        -F "report=@$ZAP_HTML"

    # ====================================
    # k6 Performance Test
    # ====================================
    - name: Install k6
      run: |
        curl https://github.com/grafana/k6/releases/download/v0.50.0/k6-v0.50.0-linux-amd64.tar.gz -L | tar xvz
        sudo mv k6-v0.50.0-linux-amd64/k6 /usr/local/bin/
        k6 version

    - name: Run k6 Performance Test
      run: |
        APP_URL="http://localhost:${APP_PORT}" \
        PRODUCT_NAME="${{ env.TARGET_REPO }}" \
        k6 run k6-test.js 2>&1 | tee k6-output.txt || true

    - name: Parse k6 results and send to backend
      run: |
        python3 - <<'EOF'
        import re, json, requests, os

        try:
            output = open("k6-output.txt").read()
        except:
            output = ""

        print("K6 OUTPUT:")
        print(output)

        def to_ms(s):
            if not s:
                return 0
            s = s.strip()
            if "µs" in s or "us" in s:
                val = float(re.sub(r'[^\d.]', '', s.replace("µs","").replace("us","")))
                return round(val / 1000, 4)
            elif "ms" in s:
                return round(float(re.sub(r'[^\d.]', '', s.replace("ms",""))), 2)
            elif "s" in s and "m" not in s:
                return round(float(re.sub(r'[^\d.]', '', s.replace("s",""))) * 1000, 2)
            elif "m" in s:
                parts = re.findall(r'(\d+\.?\d*)', s)
                if len(parts) >= 2:
                    return round(float(parts[0]) * 60000 + float(parts[1]) * 1000, 2)
            try:
                return round(float(re.sub(r'[^\d.]', '', s)), 2)
            except:
                return 0

        def get_ms(pattern, text=None):
          src = text if text else output
          m = re.search(pattern, src)
          return to_ms(m.group(1)) if m else 0

        def get_float(pattern):
            m = re.search(pattern, output)
            return float(m.group(1)) if m else 0

        avg     = get_ms(r'http_req_duration[\s.✓]+:.*?avg=([\d.]+(?:µs|us|ms|s))')
        min_val = get_ms(r'http_req_duration[\s.✓]+:.*?min=([\d.]+(?:µs|us|ms|s))')
        max_val = get_ms(r'http_req_duration[\s.✓]+:.*?max=([\d.]+(?:µs|us|ms|s))')
        p90 = get_ms(r'p\(90\)=([\d.]+(?:µs|us|ms|s))', output.split('http_req_duration')[1] if 'http_req_duration' in output else output)
        p95 = get_ms(r'p\(95\)=([\d.]+(?:µs|us|ms|s))', output.split('http_req_duration')[1] if 'http_req_duration' in output else output)
        total   = int(get_float(r'http_reqs[\s.]+:\s*(\d+)'))
        tput    = get_float(r'http_reqs[\s.]+:.*?([\d.]+)/s')
        erate   = get_float(r'http_req_failed[\s.✓]+:\s*([\d.]+)%')

        summary = {
            "product_name":    os.environ.get("TARGET_REPO", "unknown"),
            "app_url":         f"http://localhost:{os.environ.get('APP_PORT', '80')}",
            "duration_secs":   150,
            "vus":             100,
            "total_requests":  total,
            "failed_requests": 0,
            "error_rate":      erate,
            "avg_response_ms": avg,
            "min_response_ms": min_val,
            "max_response_ms": max_val,
            "p90_response_ms": p90,
            "p95_response_ms": p95,
            "throughput":      tput,
        }

        print("SUMMARY:", json.dumps(summary, indent=2))

        with open("summary.json", "w") as f:
            json.dump(summary, f)

        try:
            res = requests.post(
                "http://34.62.192.66/api/performance/results",
                json=summary,
                timeout=10
            )
            print("Backend response:", res.status_code, res.text)
        except Exception as e:
            print("Failed to send:", e)
        EOF
      env:
        TARGET_REPO: ${{ env.TARGET_REPO }}
        APP_PORT: ${{ env.APP_PORT }}

    - name: Upload k6 Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: k6-report
        path: summary.json
