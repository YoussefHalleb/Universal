name: Universal DevSecOps Enterprise Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
    inputs: 
      repo_url:
        description: "GitHub repository URL (leave empty for local repo)"
        required: false
      repo_branch:
        description: "Git branch"
        required: false
        default: "main"
      app_port:
        description: "Application port (host port)"
        required: false
        default: "5000"

jobs:
  security:
    runs-on: ubuntu-latest

    env:
      APP_PORT: ${{ github.event.inputs.app_port || '5000' }}
      APP_INTERNAL_PORT: "5000"
      IMAGE_NAME: scanned-app

      # From docker-compose.yml
      APP_SERVICE: "vuln-nodejs"

      # Targets inside docker network
      TARGET_BASE: "http://vuln-nodejs:5000"

    steps:
      - name: Detect scan mode
        run: |
          if [ -z "${{ github.event.inputs.repo_url }}" ]; then
            echo "SCAN_MODE=LOCAL" >> $GITHUB_ENV
            echo "WORKDIR=." >> $GITHUB_ENV
          else
            echo "SCAN_MODE=EXTERNAL" >> $GITHUB_ENV
            echo "WORKDIR=target-app" >> $GITHUB_ENV
          fi

      - name: Extract target repository name
        run: |
          if [ -z "${{ github.event.inputs.repo_url }}" ]; then
            echo "TARGET_REPO=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV
          else
            REPO_URL="${{ github.event.inputs.repo_url }}"
            REPO_NAME=$(basename -s .git "$REPO_URL")
            echo "TARGET_REPO=$REPO_NAME" >> $GITHUB_ENV
          fi

      - name: Checkout pipeline repository
        uses: actions/checkout@v4

      - name: Clone external repository
        if: env.SCAN_MODE == 'EXTERNAL'
        run: |
          git clone -b ${{ github.event.inputs.repo_branch }} \
            ${{ github.event.inputs.repo_url }} target-app

      - name: Build Docker Image (for Trivy)
        run: |
          cd "$WORKDIR"
          docker build -t "$IMAGE_NAME" .

      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}
          format: json
          output: trivy.json
        continue-on-error: true

      - name: Ensure .env exists (compose requires it)
        run: |
          cd "$WORKDIR"
          if [ ! -f .env ]; then
            cat > .env <<'EOF'
NODE_ENV=development
PORT=5000
EOF
          fi

      - name: Run Application (docker compose)
        run: |
          cd "$WORKDIR"
          docker compose up -d --build

      - name: Show running containers
        run: docker ps -a

      - name: Get docker-compose network
        run: |
          cd "$WORKDIR"
          NET=$(docker network ls --format '{{.Name}}' | grep "_default$" | head -n 1)
          if [ -z "$NET" ]; then
            echo "Could not detect compose network automatically"
            docker network ls
            exit 1
          fi
          echo "ZAP_NET=$NET" >> $GITHUB_ENV
          echo "Using network: $NET"

      - name: Wait for Application (HTTP check from compose network)
        run: |
          for i in {1..50}; do
            code=$(docker run --rm --network "$ZAP_NET" curlimages/curl:8.5.0 \
              -s -o /dev/null -w "%{http_code}" "$TARGET_BASE" || true)
            if echo "$code" | grep -qE "200|302|401|403"; then
              echo "App is up (HTTP $code)"
              exit 0
            fi
            echo "Waiting for app... (got $code)"
            docker logs --tail 80 "$APP_SERVICE" || true
            sleep 3
          done
          echo "App did not become ready in time"
          docker logs "$APP_SERVICE" || true
          exit 1

      - name: Detect Swagger JSON URL (auto)
        run: |
          set -e
          CANDIDATES=(
            "http://vuln-nodejs:5000/api-docs/swagger.json"
            "http://vuln-nodejs:5000/swagger.json"
            "http://vuln-nodejs:5000/api-docs.json"
            "http://vuln-nodejs:5000/v1/api-docs"
            "http://vuln-nodejs:5000/api-docs/v1/swagger.json"
          )

          FOUND=""
          for u in "${CANDIDATES[@]}"; do
            code=$(docker run --rm --network "$ZAP_NET" curlimages/curl:8.5.0 \
              -s -o /dev/null -w "%{http_code}" "$u" || true)
            echo "$u -> $code"
            if [ "$code" = "200" ]; then
              FOUND="$u"
              break
            fi
          done

          if [ -z "$FOUND" ]; then
            echo "Could not find swagger.json automatically."
            echo "Dumping /api-docs first lines for debugging:"
            docker run --rm --network "$ZAP_NET" curlimages/curl:8.5.0 \
              -sS "http://vuln-nodejs:5000/api-docs" | head -n 80 || true
            exit 1
          fi

          echo "TARGET_SWAGGER_JSON=$FOUND" >> $GITHUB_ENV
          echo "Found swagger.json at: $FOUND"

      - name: Create ZAP Automation Plan
        run: |
          cat > zap-plan.yaml <<'EOF'
env:
  contexts:
    - name: target
      urls:
        - http://vuln-nodejs:5000
      includePaths:
        - http://vuln-nodejs:5000.*

jobs:
  - type: openapi
    parameters:
      context: target
      apiUrl: __SWAGGER_JSON__

  - type: spider
    parameters:
      context: target
      maxDuration: 10

  - type: passiveScan-wait
    parameters:
      maxDuration: 10

  - type: activeScan
    parameters:
      context: target
      policy: Default Policy

  - type: report
    parameters:
      reportDir: /zap/wrk
      reportFile: zap.html
      reportTitle: "ZAP Full Scan Report"
      template: traditional-html

  - type: report
    parameters:
      reportDir: /zap/wrk
      reportFile: zap.xml
      template: traditional-xml
EOF
          # Replace placeholder with the detected Swagger URL
          sed -i "s|__SWAGGER_JSON__|${TARGET_SWAGGER_JSON}|g" zap-plan.yaml

      - name: OWASP ZAP Automation Scan (Full)
        run: |
          docker run --rm \
            --user root \
            --network "$ZAP_NET" \
            -v "$(pwd)":/zap/wrk \
            ghcr.io/zaproxy/zaproxy:stable \
            zap.sh -cmd -autorun /zap/wrk/zap-plan.yaml || true

      - name: Debug - list generated files
        run: |
          ls -lah
          echo "----"
          test -f zap.xml && echo "zap.xml exists" || echo "zap.xml missing"
          test -f zap.html && echo "zap.html exists" || echo "zap.html missing"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: AI Security Analysis
        run: python ai_security_analysis.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }} 

      - name: Upload to DefectDojo
        run: python defectdojo_upload.py
        env:
          DEFECTDOJO_URL: ${{ secrets.DEFECTDOJO_URL }}
          DEFECTDOJO_API_KEY: ${{ secrets.DEFECTDOJO_API_KEY }}
          TARGET_REPO: ${{ env.TARGET_REPO }}

      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            trivy.json
            zap.xml
            zap.html
            ai_security_recommendations.md
