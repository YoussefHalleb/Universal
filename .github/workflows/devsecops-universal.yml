name: Universal DevSecOps Enterprise Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
    inputs:
      repo_url:
        description: "GitHub repository URL (leave empty for local repo)"
        required: false
      repo_branch:
        description: "Git branch"
        required: false
        default: "main"
      app_port:
        description: "Application port"
        required: false
        default: "80"

jobs:
  security:
    runs-on: ubuntu-latest

    env:
      APP_PORT: ${{ github.event.inputs.app_port || '80' }}
      IMAGE_NAME: scanned-app

    steps:

    # ====================================
    # Detect Scan Mode
    # ====================================
    - name: Detect scan mode
      run: |
        if [ -z "${{ github.event.inputs.repo_url }}" ]; then
          echo "SCAN_MODE=LOCAL" >> $GITHUB_ENV
          echo "WORKDIR=." >> $GITHUB_ENV
        else
          echo "SCAN_MODE=EXTERNAL" >> $GITHUB_ENV
          echo "WORKDIR=target-app" >> $GITHUB_ENV
        fi

    # ====================================
    # Extract Repository Name
    # ====================================
    - name: Extract repository name
      run: |
        if [ -z "${{ github.event.inputs.repo_url }}" ]; then
          echo "TARGET_REPO=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV
        else
          REPO_URL="${{ github.event.inputs.repo_url }}"
          REPO_NAME=$(basename -s .git "$REPO_URL")
          echo "TARGET_REPO=$REPO_NAME" >> $GITHUB_ENV
        fi

    # ====================================
    # Checkout Pipeline Repo
    # ====================================
    - name: Checkout pipeline repository
      uses: actions/checkout@v4

    # ====================================
    # Clone External Repo
    # ====================================
    - name: Clone external repository
      if: env.SCAN_MODE == 'EXTERNAL'
      run: |
        git clone -b ${{ github.event.inputs.repo_branch }} \
        ${{ github.event.inputs.repo_url }} target-app

    # ====================================
    # Build Docker Image
    # ====================================
    - name: Build Docker Image
      run: |
        cd "$WORKDIR"
        docker build -t "$IMAGE_NAME" .

    # ====================================
    # Trivy Scan (Container Scan)
    # ====================================
    - name: Trivy Image Scan
      uses: aquasecurity/trivy-action@v0.35.0
      with:
        image-ref: ${{ env.IMAGE_NAME }}
        format: json
        output: trivy.json
      continue-on-error: true

    # ====================================
    # Run Application
    # ====================================
    - name: Create Docker Network
      run: docker network create zap-net || true

    - name: Run Application
      run: |
        docker run -d \
          --name app-under-test \
          --network zap-net \
          -p ${APP_PORT}:${APP_PORT} \
          $IMAGE_NAME

    - name: Wait for Application
      run: sleep 30

    # ====================================
    # OWASP ZAP Scan (DAST)
    # ====================================
    - name: OWASP ZAP Full Scan
      run: |
        docker run --rm \
          --user root \
          --network zap-net \
          -v "$(pwd)":/zap/wrk \
          ghcr.io/zaproxy/zaproxy:stable \
          zap-full-scan.py \
          -t http://app-under-test:${APP_PORT} \
          -x zap.xml \
          -r zap.html || true

    # ====================================
    # Setup Python
    # ====================================
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: pip install requests

    # ====================================
    # Upload to DefectDojo
    # ====================================
    - name: Upload to DefectDojo
      run: python defectdojo_upload.py
      env:
        DEFECTDOJO_URL: ${{ secrets.DEFECTDOJO_URL }}
        DEFECTDOJO_API_KEY: ${{ secrets.DEFECTDOJO_API_KEY }}
        TARGET_REPO: ${{ env.TARGET_REPO }}

    # ====================================
    # Upload Security Reports
    # ====================================
    - name: Upload Security Reports
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: |
          trivy.json
          zap.xml
          zap.html

    - name: Debug - find ZAP report
      run: |
        echo "PWD=$(pwd)"
        ls -la
        find . -maxdepth 5 -name "zap.html" -print

    - name: Load backend URL
      run: |
        BACKEND_URL=$(cat backend_url.txt | tr -d '[:space:]')
        echo "BACKEND_URL=$BACKEND_URL" >> $GITHUB_ENV

    - name: Upload ZAP Report to Backend
      run: |
        ZAP_FILE=$(find . -maxdepth 5 -name "zap.html" | head -n 1)
        echo "ZAP_FILE=$ZAP_FILE"

        if [ -z "$ZAP_FILE" ]; then
          echo "zap.html not found, skipping upload"
          exit 0
        fi

        curl -X POST ${{ env.BACKEND_URL }}/api/products/upload-zap \
          -F "repo_name=${{ env.TARGET_REPO }}" \
          -F "report=@$ZAP_FILE"

    # ====================================
    # k6 Performance Test
    # ====================================
    - name: Install k6
      run: |
        curl https://github.com/grafana/k6/releases/download/v0.50.0/k6-v0.50.0-linux-amd64.tar.gz -L | tar xvz
        sudo mv k6-v0.50.0-linux-amd64/k6 /usr/local/bin/
        k6 version

    - name: Run k6 Performance Test
      run: |
        APP_URL="http://localhost:${APP_PORT}" \
        PRODUCT_NAME="${{ env.TARGET_REPO }}" \
        k6 run k6-test.js 2>&1 | tee k6-output.txt || true

    - name: Parse k6 results and send to backend
      run: |
        python3 << 'PYEOF'
        import re, json, requests, os

        try:
            output = open("k6-output.txt").read()
        except:
            output = ""

        print("=== K6 OUTPUT ===")
        print(output)
        print("=================")

        def parse_duration(s):
            if not s:
                return 0
            s = s.strip()
            total = 0
            m = re.search(r'(\d+\.?\d*)m(?!s)', s)
            if m:
                total += float(m.group(1)) * 60000
            s2 = re.search(r'(\d+\.?\d*)s(?!ms)', s)
            if s2:
                total += float(s2.group(1)) * 1000
            ms = re.search(r'(\d+\.?\d*)ms', s)
            if ms:
                total += float(ms.group(1))
            if total > 0:
                return round(total, 2)
            try:
                return float(re.sub(r'[a-zA-Z]', '', s))
            except:
                return 0

        def extract_duration(pattern):
            m = re.search(pattern, output)
            return parse_duration(m.group(1)) if m else 0

        def extract_float(pattern):
            m = re.search(pattern, output)
            return float(m.group(1)) if m else 0

        avg     = extract_duration(r'http_req_duration[^:]*:.*?avg=(\S+)')
        min_val = extract_duration(r'http_req_duration[^:]*:.*?min=(\S+)')
        max_val = extract_duration(r'http_req_duration[^:]*:.*?max=(\S+)')
        p90     = extract_duration(r'http_req_duration[^:]*:.*?p\(90\)=(\S+)')
        p95     = extract_duration(r'http_req_duration[^:]*:.*?p\(95\)=(\S+)')

        total_reqs = int(extract_float(r'http_reqs[^\d]*(\d+)'))
        throughput = extract_float(r'http_reqs[^/\n]*?(\d+\.?\d+)/s')
        error_rate = extract_float(r'http_req_failed[^%\d]*(\d+\.?\d+)%')
        failed     = int(extract_float(r'http_req_failed.*?(\d+)\s*$'))

        summary = {
            "product_name":    os.environ.get("TARGET_REPO", "unknown"),
            "app_url":         f"http://localhost:{os.environ.get('APP_PORT', '80')}",
            "duration_secs":   120,
            "vus":             100,
            "total_requests":  total_reqs,
            "failed_requests": failed,
            "error_rate":      error_rate,
            "avg_response_ms": avg,
            "min_response_ms": min_val,
            "max_response_ms": max_val,
            "p90_response_ms": p90,
            "p95_response_ms": p95,
            "throughput":      throughput,
        }

        print("Summary:", json.dumps(summary, indent=2))

        with open("summary.json", "w") as f:
            json.dump(summary, f)

        try:
            backend_url = open("backend_url.txt").read().strip()
            res = requests.post(
                backend_url + "/api/performance/results",
                json=summary,
                timeout=15
            )
            print("Backend response:", res.status_code, res.text)
        except Exception as e:
            print("Failed to send to backend:", e)
        PYEOF
      env:
        TARGET_REPO: ${{ env.TARGET_REPO }}
        APP_PORT: ${{ env.APP_PORT }}

    - name: Upload k6 Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: k6-report
        path: summary.json
