name: DAST Full Spider + Active Scan

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  zap_full_scan:
    runs-on: ubuntu-latest

    steps:

    # ===============================
    # Checkout Repository
    # ===============================
    - name: Checkout Repository
      uses: actions/checkout@v4

    # ===============================
    # OWASP ZAP Full Scan (Spider + Active)
    # ===============================
    - name: OWASP ZAP Full Scan
      run: |
       docker run --rm \
        -u root \
        -v "$(pwd)":/zap/wrk \
        ghcr.io/zaproxy/zaproxy:stable \
        zap-full-scan.py \
        -t http://testphp.vulnweb.com \
        -x /zap/wrk/zap.xml \
        -r /zap/wrk/zap.html \
        -z "-config connection.timeoutInSecs=60"
    # ===============================
    # Setup Python
    # ===============================
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: pip install requests

    # ===============================
    # Upload to DefectDojo
    # ===============================
    - name: Upload to DefectDojo
      run: python defectdojo_upload.py
      env:
        DEFECTDOJO_URL: ${{ secrets.DEFECTDOJO_URL }}
        DEFECTDOJO_API_KEY: ${{ secrets.DEFECTDOJO_API_KEY }}
        TARGET_REPO: testphp-vulnweb

    # ===============================
    # Upload Reports
    # ===============================
    - name: Upload ZAP Reports
      uses: actions/upload-artifact@v4
      with:
        name: zap-reports
        path: |
          zap.xml
          zap.html
