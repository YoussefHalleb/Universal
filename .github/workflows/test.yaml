name: Juice Shop OWASP ZAP Authenticated Scan

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  zap_scan:
    runs-on: ubuntu-latest

    steps:

      # 1️⃣ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4


      # 2️⃣ Start Juice Shop
      - name: Start Juice Shop
        run: |
          docker run -d --name juice-shop -p 3000:3000 bkimminich/juice-shop
          echo "Waiting for Juice Shop..."
          sleep 40


      # 3️⃣ Create ZAP automation plan (AUTHENTICATED)
      - name: Create Automation Plan
        run: |

          mkdir -p zap_reports

          cat <<EOF > zap_reports/zap_plan.yaml
          env:
            contexts:
              - name: JuiceShopContext
                urls:
                  - http://host.docker.internal:3000

                authentication:
                  method: json
                  parameters:
                    loginRequestUrl: http://host.docker.internal:3000/rest/user/login
                    loginRequestBody: '{"email":"admin@juice-sh.op","password":"admin123"}'
                  verification:
                      method: response
                      loggedInRegex: token
                      loggedOutRegex: Invalid

                sessionManagement:
                  method: cookie

                users:
                  - name: admin
                    credentials:
                      email: admin@juice-sh.op
                      password: admin123

            parameters:
              failOnError: false

          jobs:

            - type: spider
              parameters:
                context: JuiceShopContext
                user: admin
                url: http://host.docker.internal:3000

            - type: activeScan
              parameters:
                context: JuiceShopContext
                user: admin

            - type: report
              parameters:
                template: traditional-html
                reportDir: /zap/wrk
                reportFile: zap_report.html

            - type: report
              parameters:
                template: traditional-json
                reportDir: /zap/wrk
                reportFile: zap_report.json
          EOF


      # 4️⃣ Run ZAP automation framework
      - name: Run ZAP authenticated scan
        run: |

          docker run --rm \
            --user root \
            -v "$(pwd)/zap_reports:/zap/wrk" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap.sh \
            -cmd \
            -autorun /zap/wrk/zap_plan.yaml


      # 5️⃣ Upload reports
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: zap-auth-report
          path: zap_reports/
