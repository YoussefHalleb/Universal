name: Juice Shop OWASP ZAP Scan

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  zap_scan:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Start Juice Shop container
      - name: Start Juice Shop
        run: |
          docker run -d --name juice-shop -p 3000:3000 bkimminich/juice-shop:latest
          echo "Waiting for Juice Shop to start..."
          sleep 25

      # 3️⃣ Prepare ZAP context (LOGIN)
      - name: Prepare ZAP files
        run: |
          mkdir -p zap_reports

          cat <<EOF > zap_reports/zap_login.context
          {
            "context": {"name": "JuiceShopContext"},
            "users": [
              {
                "name": "admin",
                "credentials": {
                  "email": "admin@juice-sh.op",
                  "password": "admin123"
                }
              }
            ],
            "authentication": {
              "method": "form",
              "loginPageUrl": "http://host.docker.internal:3000/#/login",
              "loginRequestUrl": "http://host.docker.internal:3000/rest/user/login",
              "loginRequestBody": "{\"email\":\"admin@juice-sh.op\",\"password\":\"admin123\"}"
            }
          }
          EOF

      # 4️⃣ Run OWASP ZAP Full Scan (with login)
      - name: Run OWASP ZAP scan
        run: |
          docker run --rm --user root \
            -v "$(pwd)/zap_reports:/zap/wrk" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-full-scan.py \
            -t http://host.docker.internal:3000 \
            -t http://host.docker.internal:3000/rest/user \
            -c /zap/wrk/zap_login.context \
            -r /zap/wrk/zap_report.html \
            -J /zap/wrk/zap_report.json

      # 5️⃣ Upload reports
      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap_reports/
